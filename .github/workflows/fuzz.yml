name: Fuzzing

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_jsonmodem, fuzz_jsonmodem_buffers, fuzz_jsonmodem_values]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools

      - name: Restore fuzz corpora and artifacts
        id: cache-fuzz-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            fuzz/corpus
            fuzz/artifacts
          key: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz (5 000 runs per target)
        run: cargo fuzz run ${{ matrix.target }} -- -runs=5000

      - name: Save updated corpora and artifacts
        id: cache-fuzz-save
        if: always() && steps.cache-fuzz-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fuzz/corpus
            fuzz/artifacts
          key: ${{ steps.cache-fuzz-restore.outputs.cache-primary-key }}

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 7
