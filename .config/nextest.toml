[profile.default]
slow-timeout = { period = "1s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(/prop_.*/)'
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.default-miri]
slow-timeout = { period = "150s", terminate-after = 2 }

[profile.ci]
slow-timeout = { period = "5s", terminate-after = 6 }

[[profile.ci.overrides]]
filter = 'test(/prop_.*/)'
slow-timeout = { period = "30s", terminate-after = 6 }
