[package]
name = "jsonmodem"
version = "0.1.2"
edition = "2024"
authors = ["Aaron Friel <mayreply@aaronfriel.com>"]
description = "A streaming, incremental JSON parser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aaronfriel/jsonmodem"
autobenches = false
rust-version = "1.85"
autoexamples = false
autobins = false
autotests = false

[features]
serde = ["dep:serde"]
im = []

[dependencies]
memchr = { version = "2.7.5", default-features = false }
bstr = { version = "1.12.0", default-features = false, features = ["alloc"] }
ecow = "0.2"
rpds = { version = "1", default-features = true }
serde = { version = "1.0", optional = true, features = ["derive", "rc"] }
thiserror = { version = "2.0.16", default-features = false }

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
serde = { version = "1.0", features = ["derive", "rc"] }
quickcheck = "1.0"
rstest = "0.25.0"
quickcheck_macros = "1.1.0"
is_ci = "1.2.0"
serde_yaml = "0.9.34"
serde_json = { version = "1.0", features = ["preserve_order"] }
criterion = { version = "0.5", features = ["default", "html_reports"] }
jiter = "0.10.0"
paste = "1.0.7"
regex = "1.11.1"

[[test]]
name = "jsonmodem_buffers"
path = "tests/jsonmodem_buffers/mod.rs"

[[test]]
name = "jsonmodem_values"
path = "tests/jsonmodem_values/mod.rs"

[[test]]
name = "fuzz_regressions"
path = "tests/fuzz_regressions.rs"

[[test]]
name = "im_spikes"
path = "tests/im_spikes.rs"

[[test]]
name = "im_adapter"
path = "tests/im_adapter.rs"
required-features = ["im"]

[[example]]
name = "im_snapshots"
path = "examples/im_snapshots.rs"
required-features = ["im"]

[[example]]
name = "profile_events"
path = "examples/profile_events.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly,fuzzing,trace_scanner)',
] }

[lints.clippy]
pedantic = "warn"
perf = "deny"
suspicious = "deny"

[package.metadata.cargo_check_external_types]
allowed_external_types = ["serde::*"]

[[bench]]
name = "streaming_json_strategies"
harness = false

[[bench]]
name = "streaming_json_medium"
harness = false

[[bench]]
name = "streaming_json_large"
harness = false

[[bench]]
name = "streaming_json_incremental"
harness = false

[[bench]]
name = "streaming_parser"
harness = false

[[bench]]
name = "single_chunk_json_large"
harness = false

[[bench]]
name = "competitive_benchmarks"
harness = false
